<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兒童自律提醒鬧鐘與習慣養成系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter & Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
    }
    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(-2%); }
      50% { transform: translateY(0); }
    }
    .animate-bounce-gentle {
      animation: bounce-gentle 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 select-none">
  <div id="root"></div>

  <!-- Firebase v11 SDKs via ES Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 使用您專屬的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyAHisZyZDVQYIKDBFv5uqwTRk1GFztg-g0",
      authDomain: "kidalarm-a8b85.firebaseapp.com",
      projectId: "kidalarm-a8b85",
      storageBucket: "kidalarm-a8b85.firebasestorage.app",
      messagingSenderId: "393307278809",
      appId: "1:393307278809:web:a8577d2997447ae5cd9dc8"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 將 Firebase 實例曝露給全域以供 React 元件存取
    window.firebaseApp = app;
    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.firebaseHelpers = { doc, setDoc, getDoc, onSnapshot, signInAnonymously };
  </script>

  <!-- Main React App Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 預設習慣任務列表
    const INITIAL_TASKS = [
      { id: '1', title: '起床刷牙洗臉', time: '07:30', stars: 2, icon: '🪥', sound: 'chime', imageUrl: '', audioUrl: '', completed: false },
      { id: '2', title: '吃營養早餐', time: '08:00', stars: 1, icon: '🍳', sound: 'cheer', imageUrl: '', audioUrl: '', completed: false },
      { id: '3', title: '寫作業與閱讀', time: '16:30', stars: 3, icon: '📚', sound: 'chime', imageUrl: '', audioUrl: '', completed: false },
      { id: '4', title: '收拾玩具書包', time: '19:00', stars: 2, icon: '🧸', sound: 'cheer', imageUrl: '', audioUrl: '', completed: false },
      { id: '5', title: '洗澡洗頭準備', time: '20:30', stars: 2, icon: '🛁', sound: 'chime', imageUrl: '', audioUrl: '', completed: false },
      { id: '6', title: '上床睡覺囉', time: '21:30', stars: 3, icon: '🛌', sound: 'chime', imageUrl: '', audioUrl: '', completed: false }
    ];

    function App() {
      const [viewMode, setViewMode] = useState('kid'); // 'kid' 或 'parent'
      const [isPinLocked, setIsPinLocked] = useState(true);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);
      const parentPin = '1234';

      const [audioEnabled, setAudioEnabled] = useState(false);
      const audioCtxRef = useRef(null);

      const [currentTime, setCurrentTime] = useState(new Date());
      const [weather, setWeather] = useState({ temp: '26°C', label: '晴朗舒適', icon: '☀️' });

      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [totalStars, setTotalStars] = useState(0);
      const [goalTarget, setGoalTarget] = useState(10); // 自訂目標冰淇淋數量
      const [isLoaded, setIsLoaded] = useState(false);
      const [activeAlarmTask, setActiveAlarmTask] = useState(null);
      const [triggeredToday, setTriggeredToday] = useState(new Set());

      // 編輯任務狀態管理
      const [editingTaskId, setEditingTaskId] = useState(null);

      // 兒童模式全螢幕鎖定狀態
      const [isKidFullscreenLocked, setIsKidFullscreenLocked] = useState(false);
      const [unlockModalOpen, setUnlockModalOpen] = useState(false);
      const [unlockPinInput, setUnlockPinInput] = useState('');
      const [unlockError, setUnlockError] = useState(false);

      const [newTaskForm, setNewTaskForm] = useState({
        title: '',
        time: '12:00',
        stars: 2,
        icon: '🍦',
        sound: 'chime',
        imageUrl: '',
        audioUrl: ''
      });

      // 1. 雲端同步發送函式 (防護：禁止空陣列覆寫)
      const syncToCloud = async (updatedTasks, updatedStars, updatedGoal) => {
        if (!window.firebaseDb || !window.firebaseHelpers) return;
        if (!updatedTasks || updatedTasks.length === 0) return;

        const { doc, setDoc } = window.firebaseHelpers;
        const db = window.firebaseDb;

        try {
          const docRef = doc(db, 'kidalarm', 'routineData');
          await setDoc(docRef, {
            tasks: updatedTasks,
            totalStars: updatedStars ?? totalStars,
            goalTarget: updatedGoal ?? goalTarget,
            updatedAt: new Date().toISOString()
          }, { merge: true });
        } catch (err) {
          console.error("更新至 Firestore 失敗:", err);
        }
      };

      // 2. Firebase 連線與即時資料讀取
      useEffect(() => {
        let unsubscribe = () => {};

        const initFirebaseSync = async () => {
          if (!window.firebaseDb || !window.firebaseHelpers) {
            setTimeout(initFirebaseSync, 300);
            return;
          }

          const { doc, setDoc, onSnapshot, signInAnonymously } = window.firebaseHelpers;
          const auth = window.firebaseAuth;
          const db = window.firebaseDb;

          try {
            await signInAnonymously(auth);
          } catch (e) {
            console.warn("匿名驗證失敗:", e);
          }

          const docRef = doc(db, 'kidalarm', 'routineData');
          
          unsubscribe = onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
              const data = docSnap.data();
              if (Array.isArray(data.tasks) && data.tasks.length > 0) {
                setTasks(data.tasks);
              }
              if (typeof data.totalStars === 'number') {
                setTotalStars(data.totalStars);
              }
              if (typeof data.goalTarget === 'number' && data.goalTarget > 0) {
                setGoalTarget(data.goalTarget);
              }
            } else {
              setDoc(docRef, { tasks: INITIAL_TASKS, totalStars: 0, goalTarget: 10 }, { merge: true });
            }
            setIsLoaded(true);
          }, (err) => {
            console.error("Firestore 同步問題:", err);
            setIsLoaded(true);
          });
        };

        initFirebaseSync();
        return () => unsubscribe();
      }, []);

      // 3. 時鐘輪詢與鬧鐘觸發
      useEffect(() => {
        const timer = setInterval(() => {
          const now = new Date();
          setCurrentTime(now);

          if (!isLoaded || tasks.length === 0) return;

          const hrs = String(now.getHours()).padStart(2, '0');
          const mins = String(now.getMinutes()).padStart(2, '0');
          const timeStr = `${hrs}:${mins}`;
          const triggerKey = `${now.toDateString()}_${timeStr}`;

          tasks.forEach(task => {
            if (!task.completed && task.time === timeStr) {
              const key = `${task.id}_${triggerKey}`;
              if (!triggeredToday.has(key)) {
                setTriggeredToday(prev => new Set(prev).add(key));
                triggerAlarm(task);
              }
            }
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [tasks, triggeredToday, isLoaded]);

      // 4. 音效處理
      const initAudio = () => {
        if (!audioCtxRef.current) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          audioCtxRef.current = new AudioCtx();
        }
        if (audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        setAudioEnabled(true);
      };

      const playSoundEffect = (soundType = 'chime', customAudioUrl = '') => {
        if (customAudioUrl) {
          try {
            const customAudio = new Audio(customAudioUrl);
            customAudio.play().catch(e => console.warn("無法播放自訂音效", e));
            return;
          } catch(e) {}
        }

        if (!audioCtxRef.current) return;
        const ctx = audioCtxRef.current;
        const now = ctx.currentTime;

        if (soundType === 'cheer') {
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0.3, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.4);
          });
        } else {
          const freqs = [523.25, 659.25, 783.99];
          freqs.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.15);
            gain.gain.setValueAtTime(0.4, now + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.7);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.15);
            osc.stop(now + i * 0.15 + 0.7);
          });
        }
      };

      const triggerAlarm = (task) => {
        setActiveAlarmTask(task);
        if (audioEnabled) {
          playSoundEffect(task.sound || 'chime', task.audioUrl);
        }
      };

      // 5. 任務與目標操作
      const handleCompleteTask = (taskId) => {
        const target = tasks.find(t => t.id === taskId);
        const earned = target ? target.stars : 2;
        const newStars = totalStars + earned;
        const updated = tasks.map(t => t.id === taskId ? { ...t, completed: true } : t);

        setTasks(updated);
        setTotalStars(newStars);
        syncToCloud(updated, newStars, goalTarget);
        setActiveAlarmTask(null);

        if (audioEnabled) playSoundEffect('cheer');
      };

      // 提交表單：新增或儲存編輯
      const handleSaveTaskForm = (e) => {
        e.preventDefault();
        if (!newTaskForm.title.trim()) return;

        let updated;
        if (editingTaskId) {
          // 編輯現有任務
          updated = tasks.map(t => t.id === editingTaskId ? {
            ...t,
            title: newTaskForm.title,
            time: newTaskForm.time,
            stars: Number(newTaskForm.stars),
            icon: newTaskForm.icon || '🍦',
            sound: newTaskForm.sound || 'chime',
            imageUrl: newTaskForm.imageUrl || '',
            audioUrl: newTaskForm.audioUrl || ''
          } : t).sort((a, b) => a.time.localeCompare(b.time));
          setEditingTaskId(null);
        } else {
          // 新增任務
          const newTask = {
            id: Date.now().toString(),
            title: newTaskForm.title,
            time: newTaskForm.time,
            stars: Number(newTaskForm.stars),
            icon: newTaskForm.icon || '🍦',
            sound: newTaskForm.sound || 'chime',
            imageUrl: newTaskForm.imageUrl || '',
            audioUrl: newTaskForm.audioUrl || '',
            completed: false
          };
          updated = [...tasks, newTask].sort((a, b) => a.time.localeCompare(b.time));
        }

        setTasks(updated);
        syncToCloud(updated, totalStars, goalTarget);
        setNewTaskForm({ title: '', time: '12:00', stars: 2, icon: '🍦', sound: 'chime', imageUrl: '', audioUrl: '' });
      };

      // 點擊編輯按鈕：將任務資料載入到左側表單
      const handleStartEdit = (task) => {
        setEditingTaskId(task.id);
        setNewTaskForm({
          title: task.title,
          time: task.time,
          stars: task.stars,
          icon: task.icon || '🍦',
          sound: task.sound || 'chime',
          imageUrl: task.imageUrl || '',
          audioUrl: task.audioUrl || ''
        });
        // 自動捲動到上方表單讓使用者編輯
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // 取消編輯
      const handleCancelEdit = () => {
        setEditingTaskId(null);
        setNewTaskForm({ title: '', time: '12:00', stars: 2, icon: '🍦', sound: 'chime', imageUrl: '', audioUrl: '' });
      };

      const handleDeleteTask = (id) => {
        const updated = tasks.filter(t => t.id !== id);
        if (updated.length === 0) {
          alert("至少必須保留一個任務！");
          return;
        }
        if (editingTaskId === id) handleCancelEdit();
        setTasks(updated);
        syncToCloud(updated, totalStars, goalTarget);
      };

      const handleResetDailyTasks = () => {
        const updated = tasks.map(t => ({ ...t, completed: false }));
        setTasks(updated);
        syncToCloud(updated, totalStars, goalTarget);
      };

      const handleUpdateGoal = (newGoal) => {
        const val = Math.max(1, Number(newGoal) || 1);
        setGoalTarget(val);
        syncToCloud(tasks, totalStars, val);
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput === parentPin) {
          setIsPinLocked(false);
          setPinError(false);
          setPinInput('');
        } else {
          setPinError(true);
          setPinInput('');
        }
      };

      const enterKidFullscreen = () => {
        if (!audioEnabled) initAudio();
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(err => console.warn(err));
        }
        setIsKidFullscreenLocked(true);
      };

      const handleUnlockSubmit = (e) => {
        e.preventDefault();
        if (unlockPinInput === parentPin) {
          setIsKidFullscreenLocked(false);
          setUnlockModalOpen(false);
          setUnlockPinInput('');
          setUnlockError(false);
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(err => console.warn(err));
          }
        } else {
          setUnlockError(true);
          setUnlockPinInput('');
        }
      };

      const formattedTimeStr = currentTime.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
      const currentCollected = totalStars % goalTarget;
      const displayCollectedCount = totalStars >= goalTarget ? goalTarget : currentCollected;

      return (
        <div className={`min-h-screen flex flex-col ${isKidFullscreenLocked ? 'bg-slate-900 text-white' : 'bg-slate-50 text-slate-800'}`}>
          
          {isKidFullscreenLocked && (
            <div className="fixed top-3 right-3 z-50">
              <button 
                onClick={() => setUnlockModalOpen(true)}
                className="w-12 h-12 rounded-full bg-slate-800/60 hover:bg-slate-800 text-white/50 hover:text-white flex items-center justify-center backdrop-blur-md transition shadow-lg text-lg"
                title="點擊輸入密碼解鎖"
              >
                🔒
              </button>
            </div>
          )}

          {unlockModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white text-slate-900 rounded-3xl max-w-sm w-full p-8 text-center space-y-6 shadow-2xl border-4 border-amber-400">
                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-3xl flex items-center justify-center mx-auto text-3xl">🔒</div>
                <div>
                  <h2 className="text-xl font-black">輸入解鎖密碼</h2>
                  <p className="text-xs text-slate-500 mt-1">請輸入家長 PIN 碼 (預設: 1234)</p>
                </div>
                <form onSubmit={handleUnlockSubmit} className="space-y-4">
                  <input
                    type="password"
                    maxLength={6}
                    autoFocus
                    value={unlockPinInput}
                    onChange={(e) => setUnlockPinInput(e.target.value)}
                    placeholder="請輸入密碼"
                    className="w-full text-center tracking-widest text-2xl font-bold py-3 border-2 border-slate-200 rounded-2xl focus:border-amber-400 outline-none"
                  />
                  {unlockError && <p className="text-xs text-red-500 font-bold">密碼錯誤，請再試一次</p>}
                  <div className="flex space-x-2">
                    <button type="button" onClick={() => setUnlockModalOpen(false)} className="flex-1 bg-slate-200 text-slate-700 font-bold py-3 rounded-2xl text-sm">取消</button>
                    <button type="submit" className="flex-1 bg-slate-900 text-white font-bold py-3 rounded-2xl text-sm">解鎖</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {!isKidFullscreenLocked && (
            <header className="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-sm">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-400 to-amber-400 flex items-center justify-center text-white font-bold text-xl shadow-md">
                  🍦
                </div>
                <div>
                  <h1 className="font-black text-slate-800 text-lg sm:text-xl">兒童自律時鐘</h1>
                  <p className="text-xs text-slate-400">免開電腦 • 手機與平板即時同步</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button
                  onClick={() => {
                    if (!audioEnabled) initAudio();
                    else setAudioEnabled(false);
                  }}
                  className={`text-xs px-3 py-2 rounded-xl font-bold transition flex items-center space-x-1 ${
                    audioEnabled ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'
                  }`}
                >
                  <span>{audioEnabled ? '🔊 提示音已開啟' : '🔇 點擊啟用聲音'}</span>
                </button>

                <div className="bg-slate-100 p-1 rounded-2xl flex border border-slate-200">
                  <button
                    onClick={() => setViewMode('kid')}
                    className={`px-3 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition ${
                      viewMode === 'kid' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'
                    }`}
                  >
                    📱 兒童時鐘
                  </button>
                  <button
                    onClick={() => setViewMode('parent')}
                    className={`px-3 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition ${
                      viewMode === 'parent' ? 'bg-white text-amber-600 shadow-sm' : 'text-slate-500'
                    }`}
                  >
                    🔒 家長後台
                  </button>
                </div>
              </div>
            </header>
          )}

          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">
            {viewMode === 'kid' ? (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-sky-400 via-indigo-500 to-purple-500 rounded-3xl p-6 sm:p-10 text-white shadow-xl relative overflow-hidden">
                  
                  {!isKidFullscreenLocked && (
                    <div className="absolute top-4 right-4">
                      <button
                        onClick={enterKidFullscreen}
                        className="bg-white/20 hover:bg-white/30 text-white font-bold text-xs sm:text-sm px-4 py-2 rounded-2xl backdrop-blur-md border border-white/30 transition flex items-center space-x-1 shadow-md"
                      >
                        <span>⛶ 全螢幕鎖定</span>
                      </button>
                    </div>
                  )}

                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                      <div className="text-white/80 font-bold text-base">
                        📅 {currentTime.toLocaleDateString('zh-TW', { weekday: 'long', month: 'long', day: 'numeric' })}
                      </div>
                      <div className="text-7xl sm:text-8xl font-black font-mono my-3 tracking-wide">
                        {formattedTimeStr}
                      </div>
                      <p className="text-white/90 text-base font-bold">
                        累計總共收穫 <span className="text-pink-300 text-2xl px-1">{totalStars}</span> 支冰淇淋 🍦
                      </p>
                    </div>

                    <div className="bg-white/10 backdrop-blur-md p-5 sm:p-6 rounded-3xl border border-white/20 flex items-center space-x-4">
                      <div className="text-5xl sm:text-6xl">{weather.icon}</div>
                      <div>
                        <div className="text-xl sm:text-2xl font-bold">{weather.temp}</div>
                        <div className="text-sm text-white/80">{weather.label}</div>
                      </div>
                    </div>
                  </div>

                  <div className="mt-8 bg-white/15 backdrop-blur-md rounded-3xl p-6 border border-white/20">
                    <div className="flex justify-between items-center text-sm sm:text-base mb-4 font-bold">
                      <span>🍦 目標蒐集進度 ({displayCollectedCount} / {goalTarget} 支)</span>
                      <span className="text-pink-300 font-mono">總進度: {totalStars} 支</span>
                    </div>

                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-2 sm:gap-3">
                      {Array.from({ length: goalTarget }).map((_, idx) => {
                        const isCollected = idx < displayCollectedCount;
                        return (
                          <div 
                            key={idx} 
                            className={`aspect-square rounded-2xl flex items-center justify-center text-2xl sm:text-3xl transition-all duration-300 ${
                              isCollected 
                                ? 'bg-white shadow-lg scale-105 border-2 border-pink-300' 
                                : 'bg-black/20 opacity-30 grayscale filter'
                            }`}
                          >
                            🍦
                          </div>
                        );
                      })}
                    </div>
                  </div>

                </div>
              </div>
            ) : (
              <div>
                {isPinLocked ? (
                  <div className="max-w-md mx-auto my-12 bg-white rounded-3xl p-8 border border-slate-200 shadow-xl text-center space-y-6">
                    <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-3xl flex items-center justify-center mx-auto text-3xl">🔒</div>
                    <div>
                      <h2 className="text-xl font-black text-slate-800">家長後台安全解鎖</h2>
                      <p className="text-xs text-slate-500 mt-1">請輸入預設密碼 (預設 PIN: 1234)</p>
                    </div>

                    <form onSubmit={handlePinSubmit} className="space-y-4">
                      <input
                        type="password"
                        maxLength={6}
                        value={pinInput}
                        onChange={(e) => setPinInput(e.target.value)}
                        placeholder="請輸入密碼"
                        className="w-full text-center tracking-widest text-2xl font-bold py-3 border-2 border-slate-200 rounded-2xl focus:border-amber-400 outline-none"
                      />
                      {pinError && <p className="text-xs text-red-500 font-bold">密碼錯誤，請再試一次</p>}
                      <button type="submit" className="w-full bg-slate-900 text-white font-bold py-3 rounded-2xl">解鎖進入</button>
                    </form>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-slate-900 text-white p-6 rounded-3xl flex justify-between items-center">
                      <div>
                        <h2 className="text-xl font-black">家長任務管理控制台</h2>
                        <p className="text-xs text-slate-400 mt-0.5">所有變更將會即時雲端同步至所有裝置</p>
                      </div>
                      <div className="flex items-center space-x-2">
                        <button
                          onClick={handleResetDailyTasks}
                          className="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-3 py-2 rounded-xl text-slate-300"
                        >
                          🔄 重設今日完成狀態
                        </button>
                        <button
                          onClick={() => setIsPinLocked(true)}
                          className="bg-amber-400 hover:bg-amber-500 text-slate-900 text-xs font-bold px-3 py-2 rounded-xl"
                        >
                          鎖定後台
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                      <div className="space-y-6">
                        <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                          <h3 className="font-extrabold text-slate-800 text-base">🎯 冰淇淋蒐集目標設定</h3>
                          <div>
                            <label className="block text-slate-600 font-bold mb-1 text-xs">一輪目標蒐集幾支冰淇淋？</label>
                            <input
                              type="number"
                              min={1}
                              max={50}
                              value={goalTarget}
                              onChange={(e) => handleUpdateGoal(e.target.value)}
                              className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-mono focus:border-indigo-500 outline-none"
                            />
                          </div>
                        </div>

                        {/* 新增或編輯任務表單 */}
                        <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                          <div className="flex justify-between items-center">
                            <h3 className="font-extrabold text-slate-800 text-base">
                              {editingTaskId ? '✏️ 編輯任務設定' : '➕ 新增提醒任務'}
                            </h3>
                            {editingTaskId && (
                              <button 
                                type="button" 
                                onClick={handleCancelEdit}
                                className="text-xs text-red-500 hover:underline font-bold"
                              >
                                取消編輯
                              </button>
                            )}
                          </div>
                          
                          <form onSubmit={handleSaveTaskForm} className="space-y-4 text-xs">
                            <div>
                              <label className="block text-slate-600 font-bold mb-1">任務名稱</label>
                              <input
                                type="text"
                                required
                                placeholder="例如：整理房間、讀繪本..."
                                value={newTaskForm.title}
                                onChange={(e) => setNewTaskForm({ ...newTaskForm, title: e.target.value })}
                                className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:border-indigo-500 outline-none"
                              />
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                              <div>
                                <label className="block text-slate-600 font-bold mb-1">提醒時間</label>
                                <input
                                  type="time"
                                  required
                                  value={newTaskForm.time}
                                  onChange={(e) => setNewTaskForm({ ...newTaskForm, time: e.target.value })}
                                  className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-mono focus:border-indigo-500 outline-none"
                                />
                              </div>
                              <div>
                                <label className="block text-slate-600 font-bold mb-1">獎勵冰淇淋</label>
                                <select
                                  value={newTaskForm.stars}
                                  onChange={(e) => setNewTaskForm({ ...newTaskForm, stars: e.target.value })}
                                  className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:border-indigo-500 outline-none"
                                >
                                  <option value={1}>1 支 🍦</option>
                                  <option value={2}>2 支 🍦🍦</option>
                                  <option value={3}>3 支 🍦🍦🍦</option>
                                </select>
                              </div>
                            </div>

                            <div>
                              <label className="block text-slate-600 font-bold mb-1">自訂圖片網址 (彈窗滿版顯示)</label>
                              <input
                                type="url"
                                placeholder="貼上圖片網址 (https://.../image.jpg)"
                                value={newTaskForm.imageUrl}
                                onChange={(e) => setNewTaskForm({ ...newTaskForm, imageUrl: e.target.value })}
                                className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:border-indigo-500 outline-none"
                              />
                            </div>

                            <div>
                              <label className="block text-slate-600 font-bold mb-1">自訂提醒音效網址 (MP3)</label>
                              <input
                                type="url"
                                placeholder="貼上音效檔網址 (https://.../alarm.mp3)"
                                value={newTaskForm.audioUrl}
                                onChange={(e) => setNewTaskForm({ ...newTaskForm, audioUrl: e.target.value })}
                                className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:border-indigo-500 outline-none"
                              />
                            </div>

                            <button
                              type="submit"
                              className={`w-full font-bold py-3 rounded-xl shadow-md transition text-sm ${
                                editingTaskId 
                                  ? 'bg-amber-500 hover:bg-amber-600 text-white' 
                                  : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                              }`}
                            >
                              {editingTaskId ? '儲存修改' : '儲存並加入任務'}
                            </button>
                          </form>
                        </div>
                      </div>

                      <div className="lg:col-span-2 bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                        <div className="flex justify-between items-center">
                          <h3 className="font-extrabold text-slate-800 text-base">現有任務列表 ({tasks.length})</h3>
                          <span className="text-xs text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full font-bold border border-emerald-100">
                            🟢 Firebase 雲端自動同步中
                          </span>
                        </div>

                        {tasks.length === 0 ? (
                          <div className="text-center py-12 text-slate-400 text-sm">
                            目前尚未新增任何習慣任務，請點擊左側進行建立！
                          </div>
                        ) : (
                          <div className="space-y-3">
                            {tasks.map((task) => (
                              <div key={task.id} className={`flex items-center justify-between p-4 border rounded-2xl transition ${editingTaskId === task.id ? 'bg-amber-50 border-amber-300' : 'bg-slate-50 border-slate-200'}`}>
                                <div className="flex items-center space-x-3">
                                  {task.imageUrl ? (
                                    <img src={task.imageUrl} alt={task.title} className="w-10 h-10 object-cover rounded-xl" />
                                  ) : (
                                    <span className="text-2xl">{task.icon}</span>
                                  )}
                                  <div>
                                    <div className="font-bold text-slate-800 text-sm">{task.title}</div>
                                    <div className="text-xs text-slate-400 font-mono">⏰ {task.time} | 🍦 +{task.stars}</div>
                                  </div>
                                </div>
                                <div className="flex items-center space-x-2">
                                  <button
                                    onClick={() => triggerAlarm(task)}
                                    className="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-bold"
                                  >
                                    試聽
                                  </button>
                                  <button
                                    onClick={() => handleStartEdit(task)}
                                    className="px-3 py-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-xl text-xs font-bold"
                                  >
                                    編輯
                                  </button>
                                  <button
                                    onClick={() => handleDeleteTask(task.id)}
                                    className="px-3 py-1.5 bg-red-100 hover:bg-red-200 text-red-600 rounded-xl text-xs font-bold"
                                  >
                                    刪除
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {activeAlarmTask && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border-4 border-pink-400 relative animate-bounce-gentle flex flex-col">
                <div className="w-full bg-slate-100 relative min-h-[220px] max-h-[320px] flex items-center justify-center overflow-hidden">
                  {activeAlarmTask.imageUrl ? (
                    <img 
                      src={activeAlarmTask.imageUrl} 
                      alt={activeAlarmTask.title} 
                      className="w-full h-full object-cover max-h-[320px]" 
                    />
                  ) : (
                    <div className="text-8xl py-8">{activeAlarmTask.icon}</div>
                  )}
                  <div className="absolute top-3 left-3 bg-pink-500 text-white font-black text-xs px-3 py-1.5 rounded-full shadow-md flex items-center space-x-1">
                    <span>⏰ 時間到了！</span>
                  </div>
                </div>

                <div className="p-6 text-slate-900 text-center space-y-4">
                  <div>
                    <h2 className="text-3xl font-black">{activeAlarmTask.title}</h2>
                    <p className="text-sm text-slate-500 mt-1">
                      完成這個習慣，就能獲得 <span className="font-extrabold text-pink-500 text-lg">{activeAlarmTask.stars} 支冰淇淋</span>！
                    </p>
                  </div>

                  <div>
                    <button
                      onClick={() => handleCompleteTask(activeAlarmTask.id)}
                      className="w-full bg-gradient-to-r from-pink-400 to-rose-500 hover:from-pink-500 hover:to-rose-600 text-white font-black text-xl py-4 rounded-2xl shadow-xl transition transform active:scale-95"
                    >
                      按這裡：我完成了！ 🍦
                    </button>
                    <button
                      onClick={() => setActiveAlarmTask(null)}
                      className="mt-3 text-xs text-slate-400 hover:text-slate-600 underline block mx-auto"
                    >
                      稍後再提醒我
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
